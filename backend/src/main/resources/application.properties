spring.application.name=cem-backend
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:cemdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# For hosting, set CEM_CORS_ALLOWED_ORIGINS to the exact frontend origin.
cem.cors.allowed-origins=${CEM_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Local-only bootstrap account. Override both values with environment variables before hosting.
cem.admin-email=${CEM_ADMIN_EMAIL:principal@cem.local}
cem.admin-password=${CEM_ADMIN_PASSWORD:ChangeMe!2026}
